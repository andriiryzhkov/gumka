# On every push to main: CI, then the macOS app, published as the rolling "nightly"
# pre-release (replaced on each run) and kept as a workflow artifact for two weeks.
name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest push to main is built.
  group: nightly
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  bundle:
    name: Build Gumka.app
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Restore the models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('models.toml') }}
      - name: Download and check the models
        run: cargo xtask models
      - name: Build the app and disk image
        run: cargo xtask bundle
      - name: Collect the disk image
        run: |
          mkdir dist
          mv target/bundle/Gumka-*-arm64.dmg dist/Gumka-nightly-arm64.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gumka-nightly-${{ github.sha }}
          path: dist/
          retention-days: 14
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The latest build of \`main\`, from ${GITHUB_SHA} ($(date -u +%Y-%m-%d)). For Apple Silicon"
            echo "Macs with macOS 13 or later. Not for everyday use: it may be broken."
            echo
            cat <<'EOF'
          The app isn't signed, so macOS blocks it at first. Before opening the disk image, remove
          the quarantine from it:

          ```sh
          xattr -d com.apple.quarantine ~/Downloads/Gumka-*.dmg
          ```

          If Gumka is already installed, run:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Gumka.app
          ```
          EOF
          } > notes.md
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* --prerelease --latest=false \
            --title "Nightly" --notes-file notes.md --target "$GITHUB_SHA"
