# On every push to main: CI, then the macOS app and the Linux AppImage, published together as
# the rolling "nightly" pre-release (replaced on each run) and kept as workflow artifacts for two
# weeks.
name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest push to main is built.
  group: nightly
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  macos:
    name: Build Gumka.app
    needs: test
    runs-on: macos-26
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Restore the models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('models.toml') }}
      - name: Download and check the models
        run: cargo xtask models
      - name: Build the app and disk image
        run: cargo xtask bundle
      - name: Collect the disk image
        run: |
          mkdir dist
          mv target/bundle/Gumka-*-arm64.dmg dist/Gumka-nightly-arm64.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gumka-nightly-macos-${{ github.sha }}
          path: dist/
          retention-days: 14

  linux:
    name: Build the AppImage
    needs: test
    # The oldest Ubuntu the runners have: the AppImage runs on its glibc (2.35) and newer.
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the packaging tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools desktop-file-utils
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Restore the models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          # Linux has models of its own; the OS in the key keeps them from the Mac's cache.
          key: models-${{ runner.os }}-${{ hashFiles('models.toml') }}
      - name: Download and check the models
        run: cargo xtask models
      - name: Build the AppImage
        run: cargo xtask bundle
      - name: Collect the AppImage
        run: |
          mkdir dist
          mv target/bundle/Gumka-*-x86_64.AppImage dist/Gumka-nightly-x86_64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gumka-nightly-linux-${{ github.sha }}
          path: dist/
          retention-days: 14

  publish:
    name: Replace the nightly release
    needs: [macos, linux]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gumka-nightly-*-${{ github.sha }}
          path: dist
          merge-multiple: true
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "The latest build of \`main\`, from ${GITHUB_SHA} ($(date -u +%Y-%m-%d)). Not for"
            echo "everyday use: it may be broken."
            echo
            cat <<'EOF'
          **macOS** (Apple Silicon, macOS 13 or later): `Gumka-nightly-arm64.dmg`. The app isn't
          signed, so macOS blocks it at first. Before opening the disk image, remove the quarantine
          from it:

          ```sh
          xattr -d com.apple.quarantine ~/Downloads/Gumka-*.dmg
          ```

          If Gumka is already installed, run:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Gumka.app
          ```

          **Linux** (x86_64, glibc 2.35 or later: Ubuntu 22.04, Debian 12, Fedora 36 and newer):
          `Gumka-nightly-x86_64.AppImage`, with ONNX Runtime and the models inside. Make it
          executable and run it:

          ```sh
          chmod +x Gumka-nightly-x86_64.AppImage
          ./Gumka-nightly-x86_64.AppImage
          ```
          EOF
          } > notes.md
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* --prerelease --latest=false \
            --title "Nightly" --notes-file notes.md --target "$GITHUB_SHA"
