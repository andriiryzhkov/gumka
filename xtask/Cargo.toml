[package]
name = "xtask"
description = "Gumka development tasks: cargo xtask models, cargo xtask bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
gumka-infer = { path = "../crates/gumka-infer" }
sha2 = "0.11.1"

# `cargo xtask bundle`: the app icon, and the licenses of what goes in the package.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
png = "0.18.1"
resvg = { version = "0.45.1", default-features = false }
toml = { version = "0.9.8", default-features = false, features = ["parse", "serde"] }
