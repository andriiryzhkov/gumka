# Gumka's model registry: every model the app can use, where its files come from and how to
# check them.
#
# - `cargo xtask models` downloads the files for this platform into models/ and verifies each
#   file's size and SHA-256. Weights never go in git.
# - The app builds this file in: it is the list on the Models page and tells the app which
#   packages to open.
# - URLs are pinned to a revision, so a file can only change here, on purpose.
# - Every model needs a license compatible with GPL-3.0-or-later that allows commercial use.
#   docs/models.md has each model's provenance and inputs and outputs.

[[models]]
id = "lama"
tool = "Erase"
name = "LaMa (Big LaMa)"
summary = "Best for most objects and large areas"
format = "Core ML · 800 × 800"
license = "Apache-2.0"
source = "mlboydaisuke/LaMa-CoreML"
source_url = "https://huggingface.co/mlboydaisuke/LaMa-CoreML"
platform = "macos"
# What the app opens, under models/.
packages = ["LaMa.mlpackage"]
# Each file is downloaded from base_url + path.
base_url = "https://huggingface.co/mlboydaisuke/LaMa-CoreML/resolve/5ed76e3799ab4cad31381750d29880c267477e18/"

